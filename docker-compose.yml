services:
  mysql:
    image: mysql:8.4
    container_name: car-dealership-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: car_dealership
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: dealership
      MYSQL_PASSWORD: dealership
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
